name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install workflow validators
        run: |
          python3 -m pip install zizmor==1.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
      - name: Validate workflow security and syntax
        run: |
          zizmor --offline --strict-collection .github/workflows
          PATH="$(go env GOPATH)/bin:$PATH" ci/lint-workflows.sh
          shellcheck ci/*.sh

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}-1.98.1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo +1.98.1 fmt --all --check
      - run: cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.98.1 test --locked --workspace --all-targets
      - name: Test real media codecs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          cargo +1.98.1 test --locked --test operations real_webp_transcode -- --ignored
      - run: cargo +1.98.1 build --locked --workspace --release --bins
      - name: Enforce client dependency isolation
        run: ci/client-isolation.sh

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --workspace check
      - run: ci/client-isolation.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --workspace --all-targets

  client:
    name: Static client (${{ matrix.target }})
    needs: [workflow-security, check, msrv, dependencies]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools binutils cmake
          rustup toolchain install 1.98.1 --profile minimal --target "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-client
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build static client only
        env:
          TARGET: ${{ matrix.target }}
          CC: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C linker=musl-gcc
        run: cargo +1.98.1 build --locked --release -p tg-backup-client --target "$TARGET"
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
        run: ci/package-client.sh "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tg-backup-client-${{ matrix.target }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  container-smoke:
    needs: [workflow-security, check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --target ffmpeg -t tg-backup:smoke .
      - run: ci/container-smoke.sh
      - run: docker compose config --quiet
