name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      skip_container_smoke:
        description: Let a calling workflow perform its own container smoke tests
        type: boolean
        default: false
      skip_release_build:
        description: Let a calling workflow build its release binaries elsewhere
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install workflow validators
        run: |
          python3 -m pip install zizmor==1.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y shellcheck
          fi
      - name: Validate workflow security and syntax
        run: |
          zizmor --offline --strict-collection .github/workflows
          PATH="$(go env GOPATH)/bin:$PATH" ci/lint-workflows.sh
          shellcheck ci/*.sh

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}-1.98.1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo +1.98.1 fmt --all --check
      - run: cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.98.1 test --locked --workspace --all-targets
      - name: Test real media codecs
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          cargo +1.98.1 test --locked --test operations real_webp_transcode -- --ignored
      - name: Measure synthetic archive storage and peak memory
        if: runner.os == 'Linux'
        run: /usr/bin/time -v cargo +1.98.1 test --locked --workspace --test archive_v2 synthetic_archive_storage_report -- --ignored --nocapture
      - if: ${{ !inputs.skip_release_build }}
        run: cargo +1.98.1 build --locked --workspace --release --bins
      - name: Enforce client dependency isolation
        run: ci/client-isolation.sh

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-deny-0.20.2
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny when not restored
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --workspace check
      - run: ci/client-isolation.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --workspace --all-targets

  client:
    name: Static client (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools binutils cmake
          rustup toolchain install 1.98.1 --profile minimal --target "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-client
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build static client only
        env:
          TARGET: ${{ matrix.target }}
          CC: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C linker=musl-gcc
        run: cargo +1.98.1 build --locked --release -p tg-backup-client --target "$TARGET"
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
        run: ci/package-client.sh "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tg-backup-client-${{ matrix.target }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  container-smoke:
    if: ${{ !inputs.skip_container_smoke }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build cached smoke image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ffmpeg
          load: true
          tags: tg-backup:smoke
          cache-from: type=gha,scope=amd64-ffmpeg
          # The Dockerfile has one source build layer; min avoids uploading a large
          # intermediate cache that cannot survive source changes anyway.
          cache-to: type=gha,mode=min,scope=amd64-ffmpeg
      - run: ci/container-smoke.sh
      - run: docker compose config --quiet
