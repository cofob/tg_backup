[workspace]
members = [".", "crates/protocol", "crates/client", "crates/credentials", "crates/tui"]
resolver = "3"
exclude = ["vendor/ratatui-image", "vendor/kasuari"]

[package]
name = "tg-backup"
version = "2.3.0"
edition = "2024"
publish = false
rust-version = "1.88"
description = "Lossless Telegram TL archives in compressed SQLite epochs"

[lib]
name = "tg_backup"

[[bin]]
name = "tg-backup"
path = "src/bin/tg-backup.rs"

[dependencies]
tg-backup-tui = { version = "2.3.0", path = "crates/tui" }
tg-backup-credentials = { version = "2.3.0", path = "crates/credentials" }
tg-backup-protocol = { version = "2.3.0", path = "crates/protocol" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.6.3", features = ["derive"] }
fs2 = "0.4"
grammers-client = "=0.10.0"
grammers-mtsender = "=0.10.0"
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
grammers-tl-types = { version = "=0.10.0", features = ["impl-serde"] }
grammers-tl-parser = "1"
# rc1 changed the API used by grammers-crypto 0.10.0.
glass_pumpkin = "=2.0.0-rc0"
hex = "0.4"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup", "fallible_uint", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

# Small upstream compatibility patches preserve the single-version dependency policy.
[patch.crates-io]
ratatui-image = { path = "vendor/ratatui-image" }
kasuari = { path = "vendor/kasuari" }
