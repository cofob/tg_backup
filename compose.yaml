name: tg-backup
services:
  setup:
    image: ghcr.io/cofob/tg-backup:latest
    build:
      context: .
      target: core
    profiles: [setup]
    command: [--dataset, /data/archive, setup, --no-secure-storage]
    stdin_open: true
    tty: true
    volumes:
      - archive:/data
      - /etc/localtime:/etc/localtime:ro
  coordinator:
    image: ghcr.io/cofob/tg-backup:latest
    build:
      context: .
      target: core
    command: [--dataset, /data/archive, run]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TG_BACKUP_WORKER_SOCKET: /control/worker.sock
    depends_on:
      worker:
        condition: service_healthy
    volumes:
      - archive:/data
      - control:/control
      - /etc/localtime:/etc/localtime:ro
    # API/metrics are opt-in: configure authenticated 0.0.0.0 binds in config.toml.
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:9090:9090
    healthcheck:
      test: [CMD, tg-backup, --dataset, /data/archive, status, --json]
      interval: 30s
      timeout: 10s
      start_period: 20s
  worker:
    image: ghcr.io/cofob/tg-backup:latest-ffmpeg
    build:
      context: .
      target: ffmpeg
    command: [--dataset, /data/archive, worker-service, --socket, /control/worker.sock]
    restart: unless-stopped
    cpus: ${TG_BACKUP_WORKER_CPUS:-2}
    mem_limit: ${TG_BACKUP_WORKER_MEMORY:-2g}
    pids_limit: 256
    stop_grace_period: 60s
    volumes:
      - archive:/data
      - control:/control
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD-SHELL, 'test -S /control/worker.sock']
      interval: 5s
      timeout: 2s
volumes:
  archive:
  control:
