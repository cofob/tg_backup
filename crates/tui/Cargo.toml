[package]
name = "tg-backup-tui"
version = "2.4.0"
edition = "2024"
publish = false
rust-version = "1.88"

[dependencies]
tg-backup-protocol = { path = "../protocol", version = "2.4.0" }
anyhow = "1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "=10.0.1", default-features = false, features = ["crossterm"] }
# Keep the dependency graph on one syn/darling and miniz_oxide generation.
instability = "=0.3.12"
flate2 = "=1.1.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
blake3 = "1"
hex = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
