[package]
name = "tg-backup-client"
version = "2.4.0"
edition = "2024"
publish = false
rust-version = "1.88"
[dependencies]
tg-backup-tui = { version = "2.4.0", path = "../tui" }
tg-backup-credentials = { version = "2.4.0", path = "../credentials" }
tg-backup-protocol = { version = "2.4.0", path = "../protocol" }
anyhow = "1"
clap = { version = "=4.6.3", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
tokio = { version = "1", features = ["full"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
tempfile = "3"
